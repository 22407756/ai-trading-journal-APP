<svg width="220" height="48" viewBox="0 0 220 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tj-logo-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0a2540" />
      <stop offset="100%" stopColor="#040e1a" />
    </linearGradient>
    <linearGradient id="tj-logo-border" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38bdf8" stopOpacity="0.9" />
      <stop offset="50%" stopColor="#6366f1" stopOpacity="0.6" />
      <stop offset="100%" stopColor="#10b981" stopOpacity="0.9" />
    </linearGradient>
    <linearGradient id="tj-logo-breakout" x1="12" y1="36" x2="38" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#3b82f6" />
      <stop offset="50%" stopColor="#00f0ff" />
      <stop offset="100%" stopColor="#10b981" />
    </linearGradient>
    <linearGradient id="tj-logo-bull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#34d399" />
      <stop offset="100%" stopColor="#059669" />
    </linearGradient>
    <linearGradient id="tj-logo-sec" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#1d4ed8" />
    </linearGradient>
    <linearGradient id="tj-text-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#00f0ff" />
    </linearGradient>
  </defs>

  <!-- Logo Mark Icon -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#tj-logo-bg)" stroke="url(#tj-logo-border)" stroke-width="1.5" />
  <line x1="16" y1="23" x2="16" y2="35" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
  <rect x="14" y="26" width="4" height="6" rx="1" fill="url(#tj-logo-sec)" />
  <line x1="24" y1="18" x2="24" y2="32" stroke="#60a5fa" stroke-width="1" stroke-opacity="0.8" />
  <rect x="22" y="21" width="4" height="8" rx="1" fill="url(#tj-logo-sec)" />
  <line x1="32" y1="12" x2="32" y2="28" stroke="#34d399" stroke-width="1.25" />
  <rect x="30" y="15" width="4" height="9" rx="1" fill="url(#tj-logo-bull)" />
  <path d="M 12 33 C 18 33, 21 27, 28 20 L 35 13" stroke="url(#tj-logo-breakout)" stroke-width="2.25" stroke-linecap="round" />
  <path d="M 31 12.5 H 35.5 V 17" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 36 9 L 37.2 12.2 L 40.5 13.5 L 37.2 14.8 L 36 18 L 34.8 14.8 L 31.5 13.5 L 34.8 12.2 Z" fill="#00f0ff" />
  <circle cx="36" cy="13.5" r="1" fill="#ffffff" />

  <!-- Typography -->
  <text x="56" y="24" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" letter-spacing="0.5">TRADING</text>
  <text x="122" y="24" fill="url(#tj-text-accent)" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" letter-spacing="0.5">JOURNAL</text>
  <text x="56" y="38" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="8.5" font-weight="600" letter-spacing="1">INSTITUTIONAL TERMINAL</text>

  <!-- AI Badge -->
  <rect x="188" y="13" width="22" height="14" rx="4" fill="#0c2338" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.5" />
  <text x="193" y="24" fill="#38bdf8" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="900">AI</text>
</svg>
